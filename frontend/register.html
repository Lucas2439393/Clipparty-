<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Account aanmaken — ClipParty.nl</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f6f8fc;
    color:#172033;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}

a{
    color:inherit;
    text-decoration:none;
}

.nav{
    height:68px;
    background:#fff;
    border-bottom:1px solid #dfe6f1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 36px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:800;
}

.logo{
    width:30px;
    height:30px;
    border-radius:9px;
    background:#2563eb;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    box-shadow:0 4px 10px rgba(37,99,235,.22);
}

.login-link{
    font-size:13px;
    font-weight:700;
    color:#2563eb;
}

.container{
    width:100%;
    max-width:480px;
    margin:70px auto;
    padding:0 20px;
}

.card{
    background:#fff;
    border:1px solid #dfe6f1;
    border-radius:16px;
    padding:32px;
    box-shadow:0 12px 35px rgba(15,23,42,.06);
}

.icon{
    width:58px;
    height:58px;
    border-radius:50%;
    background:#eff6ff;
    color:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:800;
    margin:0 auto 20px;
}

h1{
    margin:0;
    text-align:center;
    font-size:30px;
    letter-spacing:-.7px;
}

.subtitle{
    margin:9px 0 28px;
    text-align:center;
    color:#64748b;
    font-size:14px;
    line-height:1.5;
}

.form-group{
    margin-bottom:17px;
}

label{
    display:block;
    margin-bottom:7px;
    font-size:12px;
    font-weight:700;
    color:#334155;
}

input{
    width:100%;
    height:46px;
    border:1px solid #cfd8e6;
    border-radius:9px;
    padding:0 13px;
    font-size:14px;
    outline:none;
    background:#fff;
}

input:focus{
    border-color:#93c5fd;
    box-shadow:0 0 0 3px rgba(37,99,235,.08);
}

button{
    width:100%;
    height:46px;
    border:0;
    border-radius:9px;
    background:#2563eb;
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    margin-top:5px;
}

button:hover{
    background:#1d4ed8;
}

button:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-bottom:17px;
    padding:11px 13px;
    border-radius:9px;
    font-size:12px;
    font-weight:600;
    line-height:1.45;
}

.message.show{
    display:block;
}

.message.error{
    background:#fef2f2;
    color:#dc2626;
    border:1px solid #fecaca;
}

.message.success{
    background:#ecfdf5;
    color:#047857;
    border:1px solid #a7f3d0;
}

.bottom{
    margin-top:22px;
    text-align:center;
    font-size:13px;
    color:#64748b;
}

.bottom a{
    color:#2563eb;
    font-weight:700;
}

@media(max-width:600px){

    .nav{
        padding:0 18px;
    }

    .container{
        margin:40px auto;
    }

    .card{
        padding:24px 20px;
    }

    h1{
        font-size:27px;
    }
}
</style>
</head>

<body>

<nav class="nav">

    <a class="brand" href="/ui/">
        <span class="logo">C</span>
        <span>ClipParty</span>
    </a>

    <a
        class="login-link"
        href="/ui/login.html"
    >
        Inloggen
    </a>

</nav>


<main class="container">

    <div class="card">

        <div class="icon">
            C
        </div>

        <h1>
            Account aanmaken
        </h1>

        <p class="subtitle">
            Maak gratis een ClipParty-account aan
            en begin direct met clips maken.
        </p>


        <div
            id="message"
            class="message"
        ></div>


        <form
            id="registerForm"
        >

            <div class="form-group">

                <label for="name">
                    Naam
                </label>

                <input
                    id="name"
                    name="name"
                    type="text"
                    placeholder="Jouw naam"
                    autocomplete="name"
                    maxlength="100"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    E-mailadres
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="jij@email.nl"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Wachtwoord
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Minimaal 8 tekens"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password2">
                    Wachtwoord bevestigen
                </label>

                <input
                    id="password2"
                    name="password2"
                    type="password"
                    placeholder="Herhaal je wachtwoord"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

            </div>


            <button
                id="registerButton"
                type="submit"
            >
                Account aanmaken
            </button>

        </form>


        <div class="bottom">

            Heb je al een account?

            <a href="/ui/login.html">
                Inloggen
            </a>

        </div>

    </div>

</main>


<script>

const API = "";


const form =
    document.getElementById("registerForm");

const button =
    document.getElementById("registerButton");

const message =
    document.getElementById("message");


function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message show " + type;

}


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const name =
            document.getElementById("name")
            .value
            .trim();

        const email =
            document.getElementById("email")
            .value
            .trim();

        const password =
            document.getElementById("password")
            .value;

        const password2 =
            document.getElementById("password2")
            .value;


        if(!name){

            showMessage(
                "Vul je naam in.",
                "error"
            );

            return;

        }


        if(!email){

            showMessage(
                "Vul je e-mailadres in.",
                "error"
            );

            return;

        }


        if(password.length < 8){

            showMessage(
                "Je wachtwoord moet minimaal 8 tekens bevatten.",
                "error"
            );

            return;

        }


        if(password !== password2){

            showMessage(
                "De wachtwoorden komen niet overeen.",
                "error"
            );

            return;

        }


        button.disabled = true;
        button.textContent = "Account aanmaken...";


        try{

            const response =
                await fetch(
                    API + "/api/auth/register",
                    {
                        method:"POST",
                        credentials:"include",
                        headers:{
                            "Content-Type":
                                "application/json",
                            "Accept":
                                "application/json"
                        },
                        body:JSON.stringify({
                            name:name,
                            email:email,
                            password:password
                        })
                    }
                );


            const data =
                await response.json().catch(
                    () => ({})
                );


            if(!response.ok){

                throw new Error(
                    data.detail ||
                    data.message ||
                    "Account aanmaken mislukt."
                );

            }


            showMessage(
                "Account aangemaakt! Je wordt ingelogd...",
                "success"
            );


            /*
             * Als de backend na registratie
             * automatisch een sessie maakt,
             * kunnen we direct naar account.
             */

            setTimeout(
                function(){

                    window.location.href =
                        "/ui/account.html";

                },
                700
            );


        }catch(error){

            console.error(
                "Registratie mislukt:",
                error
            );

            showMessage(
                error.message ||
                "Er ging iets mis bij het aanmaken van je account.",
                "error"
            );


            button.disabled = false;
            button.textContent =
                "Account aanmaken";

        }

    }
);

</script>

</body>
</html>
