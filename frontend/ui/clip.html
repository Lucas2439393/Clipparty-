<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipParty - Start Clippen</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
            min-height: 100vh;
        }

        .navbar {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: #111827;
        }

        .logo span {
            color: #6c4df6;
        }

        .back {
            text-decoration: none;
            color: #555;
            font-size: 15px;
        }

        .container {
            max-width: 1050px;
            margin: 50px auto;
            padding: 0 25px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .header p {
            color: #6b7280;
            font-size: 17px;
        }

        .card {
            background: white;
            border-radius: 18px;
            border: 1px solid #e5e7eb;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
        }

        .upload-area {
            border: 2px dashed #c7c9d3;
            border-radius: 16px;
            padding: 60px 30px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload-area:hover {
            border-color: #6c4df6;
            background: #faf9ff;
        }

        .upload-icon {
            font-size: 55px;
            margin-bottom: 18px;
        }

        .upload-area h2 {
            margin-bottom: 10px;
        }

        .upload-area p {
            color: #777;
            margin-bottom: 22px;
        }

        .upload-button {
            display: inline-block;
            background: #6c4df6;
            color: white;
            padding: 13px 25px;
            border-radius: 10px;
            font-weight: 700;
        }

        input[type="file"] {
            display: none;
        }

        .file-info {
            display: none;
            margin-top: 25px;
            padding: 18px;
            background: #f8f9fc;
            border-radius: 12px;
        }

        .file-name {
            font-weight: 700;
            margin-bottom: 6px;
        }

        .file-size {
            color: #777;
            font-size: 14px;
        }

        .options {
            margin-top: 30px;
            display: none;
        }

        .options h3 {
            margin-bottom: 15px;
        }

        .option-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .option {
            border: 1px solid #ddd;
            padding: 18px;
            border-radius: 12px;
            cursor: pointer;
        }

        .option:hover {
            border-color: #6c4df6;
        }

        .option input {
            margin-right: 8px;
        }

        .start-button {
            width: 100%;
            margin-top: 30px;
            border: none;
            background: #6c4df6;
            color: white;
            padding: 17px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            display: none;
        }

        .start-button:hover {
            background: #5940d8;
        }

        .status {
            display: none;
            margin-top: 30px;
            text-align: center;
            padding: 25px;
            background: #f8f9fc;
            border-radius: 12px;
        }

        .spinner {
            width: 35px;
            height: 35px;
            border: 4px solid #ddd;
            border-top-color: #6c4df6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 700px) {
            .navbar {
                padding: 0 20px;
            }

            .container {
                margin-top: 30px;
            }

            .header h1 {
                font-size: 30px;
            }

            .option-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">🎬 Clip<span>Party</span></div>
        <a class="back" href="../index.html">← Terug naar home</a>
    </nav>

    <main class="container">

        <div class="header">
            <h1>Start met clippen</h1>
            <p>
                Upload een lange video en ontdek automatisch de beste momenten.
            </p>
        </div>

        <div class="card">

            <label class="upload-area" for="videoInput">
                <div class="upload-icon">🎥</div>

                <h2>Upload je video</h2>

                <p>
                    Sleep je video hierheen of klik om een bestand te kiezen.
                </p>

                <span class="upload-button">
                    Video kiezen
                </span>
            </label>

            <input
                type="file"
                id="videoInput"
                accept="video/*"
            >

            <div class="file-info" id="fileInfo">
                <div class="file-name" id="fileName"></div>
                <div class="file-size" id="fileSize"></div>
            </div>

            <div class="options" id="options">

                <h3>Clip-instellingen</h3>

                <div class="option-grid">

                    <label class="option">
                        <input
                            type="radio"
                            name="format"
                            value="9:16"
                            checked
                        >
                        9:16<br>
                        <small>TikTok / Reels / Shorts</small>
                    </label>

                    <label class="option">
                        <input
                            type="radio"
                            name="format"
                            value="1:1"
                        >
                        1:1<br>
                        <small>Vierkant</small>
                    </label>

                    <label class="option">
                        <input
                            type="radio"
                            name="format"
                            value="16:9"
                        >
                        16:9<br>
                        <small>YouTube</small>
                    </label>

                </div>

                <button
                    class="start-button"
                    id="startButton"
                >
                    ✨ Video analyseren
                </button>

            </div>

            <div class="status" id="status">

                <div class="spinner"></div>

                <h3>Video wordt voorbereid...</h3>

                <p>
                    ClipParty maakt je video klaar voor analyse.
                </p>

            </div>

        </div>

    </main>

    <script>

        const videoInput = document.getElementById("videoInput");
        const fileInfo = document.getElementById("fileInfo");
        const fileName = document.getElementById("fileName");
        const fileSize = document.getElementById("fileSize");
        const options = document.getElementById("options");
        const startButton = document.getElementById("startButton");
        const status = document.getElementById("status");

        videoInput.addEventListener("change", function () {

            const file = this.files[0];

            if (!file) {
                return;
            }

            fileName.textContent = file.name;

            const sizeMB = (file.size / (1024 * 1024)).toFixed(1);

            fileSize.textContent = sizeMB + " MB";

            fileInfo.style.display = "block";
            options.style.display = "block";
            startButton.style.display = "block";

        });

        startButton.addEventListener("click", function () {

            const file = videoInput.files[0];

            if (!file) {
                alert("Kies eerst een video.");
                return;
            }

            options.style.display = "none";
            fileInfo.style.display = "none";
            startButton.style.display = "none";
            status.style.display = "block";

            /*
             * BACKEND KOPPELING KOMT HIER.
             *
             * De volgende stap is om de video daadwerkelijk
             * naar de ClipParty backend te uploaden en AI-analyse
             * te starten.
             */

            setTimeout(function () {

                status.innerHTML = `
                    <h3>Video ontvangen! 🎉</h3>
                    <p style="margin-top:10px;color:#777;">
                        De ClipParty analyse-engine wordt hier straks gestart.
                    </p>
                `;

            }, 1500);

        });

    </script>

</body>
</html>
