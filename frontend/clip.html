<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipParty — Clip maken</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f9fc;color:#172033}
header{height:64px;background:#fff;border-bottom:1px solid #e3e8ef;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.logo{font-size:22px;font-weight:800;color:#2563eb;text-decoration:none}nav a{color:#172033;text-decoration:none}
main{max-width:900px;margin:auto;padding:35px 20px}h1{margin:0 0 8px}.sub{color:#64748b;margin-bottom:30px}
.card{background:#fff;border:1px solid #e3e8ef;border-radius:14px;padding:24px;margin-bottom:18px}label{display:block;font-weight:700;margin-bottom:9px}
input[type=file],input[type=url],input[type=number]{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}
.drop{border:2px dashed #cbd5e1;border-radius:12px;padding:25px;text-align:center}.row{display:flex;gap:10px;margin-top:12px}.row input{flex:1}
button{border:0;border-radius:9px;padding:12px 18px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.5}
.secondary{background:#e2e8f0;color:#172033}.file{margin-top:10px;padding:10px;background:#f1f5f9;border-radius:8px}
#progressCard,#resultsCard{display:none}.progress{height:12px;background:#e2e8f0;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:#2563eb}
.error{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:12px;border-radius:9px;margin:15px 0}.clip{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:14px}
.clip video{width:100%;max-width:330px;background:#000;border-radius:8px}.small{color:#64748b;font-size:14px}
footer{text-align:center;color:#94a3b8;padding:30px}@media(max-width:600px){.row{flex-direction:column}}
</style></head><body>
<header><a class="logo" href="index.html">ClipParty</a><nav><a href="index.html">Home</a></nav></header>
<main><h1>Clip maken</h1><div class="sub">Upload je briefing en minimaal één bronvideo.</div>

<div class="card"><label>1. Campagnebriefing</label><div class="drop"><input id="brief" type="file" accept=".pdf,.doc,.docx,.txt"><div id="briefInfo" class="file" style="display:none"></div></div></div>

<div class="card"><label>2. Bronvideo</label><div class="drop"><input id="videos" type="file" accept="video/*" multiple><div id="videoInfo" class="file" style="display:none"></div></div>
<div class="row"><input id="youtube" type="url" placeholder="YouTube URL (optioneel)"><button type="button" class="secondary" onclick="addYoutube()">Toevoegen</button></div><div id="ytInfo"></div></div>

<div class="card"><label>3. Instellingen</label><div class="row"><input id="minClips" type="number" min="1" value="1" title="Minimum clips"><input id="maxClips" type="number" min="1" value="5" title="Maximum clips"><input id="maxDuration" type="number" min="1" value="60" title="Maximale duur"></div><p class="small">Minimum · maximum · maximale duur in seconden</p></div>

<button id="start" onclick="startClipping()">Clips maken →</button><div id="error" class="error" style="display:none"></div>
<div id="progressCard" class="card"><h2>Bezig...</h2><div class="progress"><div id="bar" class="bar"></div></div><p id="status" class="small">Job starten...</p></div>
<div id="resultsCard" class="card"><h2>Resultaten</h2><div id="results"></div></div>
</main><footer>© 2026 ClipParty</footer>

<script>
const API="https://clipparty.onrender.com";
let briefPath="",videos=[],youtubeUrls=[],jobId="",timer=null;
const $=id=>document.getElementById(id);
function error(msg){$("error").textContent=msg;$("error").style.display="block"}
function clearError(){$("error").style.display="none"}
async function upload(file){
 const f=new FormData();f.append("file",file);
 const r=await fetch(API+"/api/upload",{method:"POST",body:f});
 if(!r.ok){let d="Upload mislukt.";try{let x=await r.json();d=x.detail||d}catch(e){}throw Error(d)}
 return r.json();
}
$("brief").onchange=async function(){clearError();const file=this.files[0];if(!file)return;$("briefInfo").style.display="block";$("briefInfo").textContent="Uploaden...";
 try{const d=await upload(file);briefPath=d.path;$("briefInfo").textContent="✓ "+file.name}catch(e){briefPath="";$("briefInfo").style.display="none";error(e.message)}};
$("videos").onchange=async function(){clearError();videos=[];const files=[...this.files];if(!files.length)return;$("videoInfo").style.display="block";$("videoInfo").textContent="Video's uploaden...";
 try{for(const f of files){const d=await upload(f);videos.push(d.path)}$("videoInfo").textContent="✓ "+videos.length+" video('s) toegevoegd"}catch(e){videos=[];$("videoInfo").style.display="none";error(e.message)}};
function addYoutube(){const x=$("youtube"),u=x.value.trim();if(!u)return;if(!youtubeUrls.includes(u))youtubeUrls.push(u);x.value="";renderYoutube()}
function renderYoutube(){$("ytInfo").innerHTML=youtubeUrls.map((u,i)=>'<div class="file">'+escapeHtml(u)+' <button class="secondary" style="float:right;padding:5px 9px" onclick="removeYoutube('+i+')">×</button></div>').join("")}
function removeYoutube(i){youtubeUrls.splice(i,1);renderYoutube()}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
async function startClipping(){
 clearError();if(!briefPath)return error("Upload eerst een campagnebriefing.");if(!videos.length&&!youtubeUrls.length)return error("Voeg minimaal één bronvideo of YouTube-link toe.");
 $("start").disabled=true;$("progressCard").style.display="block";$("resultsCard").style.display="none";$("bar").style.width="2%";
 try{
  const payload={campaign_file:briefPath,videos:[...videos,...youtubeUrls],settings:{min_clips:Number($("minClips").value)||1,max_clips:Number($("maxClips").value)||5,max_duration:Number($("maxDuration").value)||60,preferred_min_duration:15,preferred_max_duration:35,aspect_ratio:"9:16",resolution:"1080x1920",subtitles:true,hooks:true,face_priority:true,avoid_audio_only:true,quality:"highest"}};
  const r=await fetch(API+"/api/campaign/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  if(!r.ok){let d="De clipping-job kon niet worden gestart.";try{let x=await r.json();d=typeof x.detail==="string"?x.detail:(x.detail?.message||d)}catch(e){}throw Error(d)}
  jobId=(await r.json()).job_id;poll();
 }catch(e){$("start").disabled=false;$("progressCard").style.display="none";error(e.message)}
}
async function poll(){
 try{
  const r=await fetch(API+"/api/jobs/"+encodeURIComponent(jobId));if(!r.ok)throw Error("Status kon niet worden opgehaald.");
  const d=await r.json(),p=Math.max(0,Math.min(100,Number(d.progress||0)));$("bar").style.width=p+"%";$("status").textContent=d.stage_label||d.stage||d.message||("Bezig... "+p+"%");
  if(d.status==="completed"){await results();$("bar").style.width="100%";$("start").disabled=false;return}
  if(d.status==="failed")throw Error(d.error||"De clipping-job is mislukt.");
  timer=setTimeout(poll,2500);
 }catch(e){$("start").disabled=false;error(e.message)}
}
async function results(){
 const r=await fetch(API+"/api/jobs/"+encodeURIComponent(jobId)+"/clips");if(!r.ok)throw Error("Resultaten konden niet worden opgehaald.");
 const clips=await r.json();$("resultsCard").style.display="block";
 if(!clips.length){$("results").innerHTML="<p>De job is klaar, maar er zijn geen clips geproduceerd.</p>";return}
 $("results").innerHTML=clips.map((c,i)=>{const u=API+"/api/files/"+encodeURIComponent(c.file_id||"");return '<div class="clip"><h3>Clip '+(i+1)+(c.filename?" — "+escapeHtml(c.filename):"")+'</h3>'+(c.file_id?'<video controls preload="metadata" src="'+u+'"></video><p><a href="'+u+'" target="_blank">Clip openen / downloaden</a></p>':"")+(c.caption?'<p>'+escapeHtml(c.caption)+'</p>':"")+'</div>'}).join("")
}
</script></body></html>
